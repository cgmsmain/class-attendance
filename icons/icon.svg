<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Inner Tech Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3" />

  <!-- Blackboard / Smartboard Screen Frame -->
  <rect x="80" y="100" width="352" height="230" rx="20" fill="#0b1329" stroke="url(#accentGrad)" stroke-width="6" filter="url(#glow)" />

  <!-- Grid Seats on Board -->
  <g fill="#38bdf8" opacity="0.8">
    <rect x="110" y="130" width="40" height="28" rx="6" />
    <rect x="170" y="130" width="40" height="28" rx="6" />
    <rect x="236" y="130" width="40" height="28" rx="6" fill="#10b981" />
    <rect x="302" y="130" width="40" height="28" rx="6" />
    <rect x="362" y="130" width="40" height="28" rx="6" />

    <rect x="110" y="180" width="40" height="28" rx="6" />
    <rect x="170" y="180" width="40" height="28" rx="6" fill="#ef4444" />
    <rect x="236" y="180" width="40" height="28" rx="6" />
    <rect x="302" y="180" width="40" height="28" rx="6" fill="#f59e0b" />
    <rect x="362" y="180" width="40" height="28" rx="6" />

    <rect x="110" y="230" width="40" height="28" rx="6" />
    <rect x="170" y="230" width="40" height="28" rx="6" />
    <rect x="236" y="230" width="40" height="28" rx="6" />
    <rect x="302" y="230" width="40" height="28" rx="6" />
    <rect x="362" y="230" width="40" height="28" rx="6" />

    <rect x="110" y="280" width="40" height="28" rx="6" />
    <rect x="170" y="280" width="40" height="28" rx="6" />
    <rect x="236" y="280" width="40" height="28" rx="6" />
    <rect x="302" y="280" width="40" height="28" rx="6" />
    <rect x="362" y="280" width="40" height="28" rx="6" />
  </g>

  <!-- Board Stand / Base -->
  <path d="M 200 330 L 160 410 L 190 410 L 220 330 Z" fill="#475569" />
  <path d="M 312 330 L 352 410 L 322 410 L 292 330 Z" fill="#475569" />
  <rect x="130" y="405" width="252" height="14" rx="7" fill="#64748b" />

  <!-- Checkmark Badge symbolizing attendance -->
  <circle cx="395" cy="115" r="38" fill="#10b981" stroke="#0f172a" stroke-width="6" />
  <path d="M 380 115 L 392 127 L 414 103" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
